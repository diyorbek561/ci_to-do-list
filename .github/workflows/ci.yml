name: Frontend ci pipline

on:
    push:
        branches: [main]
    
jobs:
    test-code:
        strategy:
            matrix:
                node-version: [20,22,24]
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Create test result file
            run: echo "Test muvaffaqiyatli !" > test-result.txt     
          - name: Upload test-result
            uses: actions/upload-artifact@v4
            with:
                name: test-result
                path: test-result.txt

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: ${{matrix.node-version}}
                cache: npm
          - name: Checkout main.js code
            run: node --check main.js
    build-code:
        needs: test-code
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: npm
            - name: Download test result
              uses: actions/download-artifact@v4
              with:
                name: test-result
            - name: Show test result
              run: cat test-result.txt
            - name: Install dependicies
              run: npm ci 
            - name: Docker image build
              run: docker build -t to-do-list .


